[package]
name = "tucupi"
version = "0.2.1"
edition = "2021"
authors = ["Lucas Eufrasio <lucaseufrasio@gmail.com>"]
description = "A concurrent dependency checker and upgrader with built-in security auditing."
repository = "https://github.com/lucaseufrasio/tucupi"
license = "MIT"
default-run = "tucupi"

[dependencies]
ratatui = "0.30.1"
crossterm = "0.29.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["json"] }
toml = "1.1.2"
anyhow = "1.0.102"
semver = "1.0.28"
thiserror = "2.0.18"
tempfile = "3.27.0"
predicates = "3.1.4"
assert_cmd = "2.2.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
