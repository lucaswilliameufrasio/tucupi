name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch, minor, major)"
        required: true
        default: "patch"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      - name: Update version in Cargo.toml
        run: |
          cargo install cargo-edit
          cargo set-version --bump ${{ github.event.inputs.version }}
      - name: Generate changelog
        uses: orhun/git-cliff-action@4a4a951bc4335673a3929348f9f63da3e6cbab9f # v4.4.2
        with:
          config: cliff.toml
          args: -o CHANGELOG.md
      - name: Create Release PR
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88b4042b5b39 # v7.0.5
        with:
          title: "chore: release v${{ github.event.inputs.version }}"
          branch: "release/${{ github.event.inputs.version }}"
          commit-message: "chore: bump version to ${{ github.event.inputs.version }}"
          body: |
            Automated release PR generated by prepare-release workflow.
            Version: ${{ github.event.inputs.version }}
